<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillCore 系统架构</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Serif+SC:wght@400&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5;
      --paper-2: #ececec;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #5a6580;
      --accent: #bf4520;
      --link: #2e5aa8;
      --rule: rgba(45, 49, 66, 0.12);
      --sans: 'Geist', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
      --serif: 'Instrument Serif', 'Noto Serif', 'Noto Serif SC', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      min-height: 100vh;
      padding: 48px 32px;
      color: var(--ink);
      background: var(--paper);
      font-family: var(--sans);
    }
    .frame { width: 100%; max-width: 1320px; margin: 0 auto; }
    .eyebrow {
      margin-bottom: 8px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    h1 {
      margin-bottom: 12px;
      color: var(--ink);
      font-family: var(--serif);
      font-size: clamp(28px, 3vw, 38px);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }
    .subtitle {
      max-width: 760px;
      margin-bottom: 24px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 1280px; }
    @media print {
      body { padding: 0; }
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Architecture · SkillCore</p>
    <h1>SkillCore 系统架构</h1>
    <p class="subtitle">用户意图从 React 界面进入本地运行时，由 Electron 主进程统一编排持久化、AI 草稿生成和 JSON 交换。</p>
